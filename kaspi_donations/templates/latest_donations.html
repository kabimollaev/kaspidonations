<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Latest Donations Widget</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        body { background-color: transparent; }
        .list-container {
            width: 100%;
            background: rgba(37, 40, 52, 0.9);
            border-radius: 10px;
            padding: 1rem;
            font-family: var(--font-family);
        }
        .list-header {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 1rem;
            border-bottom: 1px solid var(--bg-tertiary);
        }
        .list-item:last-child { border-bottom: none; }
        .item-name { color: var(--text-primary); font-weight: 500; }
        .item-amount { color: #fff; font-weight: 600; }
    </style>
</head>
<body>
    <div class="list-container">
        <div class="list-header">Последние донаты</div>
        <div id="donations-list"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listElement = document.getElementById('donations-list');

            function updateList(donations) {
                const latest = donations.slice(0, 5);

                if (latest.length === 0) {
                    listElement.innerHTML = '<p style="color: var(--text-secondary); text-align: center;">Донатов пока нет.</p>';
                    return;
                }
                
                listElement.innerHTML = latest.map(d => `
                    <div class="list-item">
                        <span class="item-name">${escapeHtml(d.name)}</span>
                        <span class="item-amount">${parseInt(d.amount)} KZT</span>
                    </div>
                `).join('');
            }

            const ws = new WebSocket(`ws://${window.location.host}/ws`);
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'full_update') {
                    updateList(msg.data.donations);
                }
            };

            function escapeHtml(unsafe) {
                return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }
        });
    </script>
</body>
</html>
