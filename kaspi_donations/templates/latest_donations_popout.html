<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Последние донаты</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        /* Дополнительные стили, чтобы убрать лишние отступы на этой странице */
        body {
            padding: 0;
            background-color: var(--bg-color);
        }
        .card {
            border-radius: 0;
            border: none;
            height: 100vh;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="card" id="donations-list-card">
        <div id="donations-list">
            <p>Загрузка...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const donationsList = document.getElementById('donations-list');
            let currentData = {};

            function renderDonations() {
                donationsList.innerHTML = '';
                if (currentData.donations && currentData.donations.length > 0) {
                    currentData.donations.forEach(d => {
                        const item = document.createElement('div');
                        item.className = 'donation-item';
                        item.innerHTML = `
                            <div class="donation-header">
                                <span class="donation-name">${d.name}</span>
                                <span class="donation-amount">${d.amount.toLocaleString('ru-RU')} ₸</span>
                            </div>
                            ${d.message ? `<p class="donation-message">"${d.message}"</p>` : ''}
                        `;
                        donationsList.appendChild(item);
                    });
                } else {
                    donationsList.innerHTML = '<p>Донатов пока нет.</p>';
                }
            }

            async function loadInitialData() {
                try {
                    const response = await fetch('/api/get_data');
                    currentData = await response.json();
                    renderDonations();
                } catch (error) {
                    console.error('Ошибка загрузки данных:', error);
                }
            }

            function connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

                ws.onmessage = function(event) {
                    const message = JSON.parse(event.data);
                    if (message.type === 'full_update') {
                        currentData = message.data;
                        renderDonations();
                    }
                };
                ws.onclose = function() {
                    setTimeout(connectWebSocket, 3000);
                };
            }

            loadInitialData();
            connectWebSocket();
        });
    </script>
</body>
</html>
