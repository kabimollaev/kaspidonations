<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- ОСНОВНЫЕ СТИЛИ --- */
        body {
            background-color: transparent !important;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            color: white;
        }

        .alert-container {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* --- ДИЗАЙН ОПОВЕЩЕНИЯ (по вашему примеру) --- */
        .alert-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .alert-box.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        
        .alert-gif {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #00D1B2;
            box-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
            margin-bottom: 20px;
        }

        .alert-content {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 16px 24px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            min-width: 300px;
        }

        .alert-main-text {
            font-weight: 700;
            font-size: 1.8rem;
            line-height: 1.2;
            margin: 0;
        }

        .alert-main-text .highlight {
            color: #00D1B2;
            font-weight: 900;
        }
        
        .alert-message {
            font-weight: 500;
            font-size: 1.1rem;
            margin-top: 8px;
            line-height: 1.4;
            color: #E0E0E0;
            word-break: break-word; 
        }

    </style>
</head>
<body>
    <div id="alert-container" class="alert-container">
        <!-- Содержимое оповещения будет вставлено сюда -->
    </div>

    <audio id="donation-sound"></audio>

    <script>
        let ws;
        let alertQueue = [];
        let isShowingAlert = false;
        let currentSettings = {};
        let lastShownAlertId = null;

        const alertContainer = document.getElementById('alert-container');
        const donationSound = document.getElementById('donation-sound');

        // --- КОНФИГУРАЦІЯ ---
        const GIF_URL = '/static/media/alert.gif'; 
        const SOUND_URL = '/static/media/alert.mp3';
        const ALERT_DURATION = 8000;

        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

            ws.onopen = () => console.log('Alert widget connected.');

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'show_alert' && message.data.id !== lastShownAlertId) {
                    alertQueue.push(message.data);
                    processQueue();
                } else if (message.type === 'tts') {
                    playTTS(message.url, currentSettings.tts_volume || 0.7);
                } else if (message.type === 'full_update') {
                    currentSettings = message.data.settings;
                    const latestDonation = message.data.donations?.[0];
                    if (latestDonation && latestDonation.id !== lastShownAlertId) {
                        const donationTime = latestDonation.id / 1000;
                        const now = Date.now() / 1000;
                        if ((now - donationTime) < 15) {
                            alertQueue.push(latestDonation);
                            processQueue();
                        }
                    }
                }
            };

            ws.onclose = () => {
                console.log('Alert widget disconnected. Reconnecting...');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function processQueue() {
            if (isShowingAlert || alertQueue.length === 0) return;
            isShowingAlert = true;
            const data = alertQueue.shift();
            
            if (data.id === lastShownAlertId) {
                isShowingAlert = false;
                processQueue();
                return;
            }
            
            lastShownAlertId = data.id;
            showAlert(data);
        }

        function showAlert(data) {
            const amountFormatted = data.amount.toLocaleString('ru-RU');
            const messageText = data.message ? escapeHtml(data.message) : '';

            alertContainer.innerHTML = `
                <div class="alert-box">
                    <img src="${GIF_URL}" class="alert-gif" alt="Donation animation">
                    <div class="alert-content">
                        <p class="alert-main-text">
                            ${escapeHtml(data.name)} - <span class="highlight">${amountFormatted} ₸</span>
                        </p>
                        ${messageText ? `<p class="alert-message">${messageText}</p>` : ''}
                    </div>
                </div>
            `;
            
            const alertBox = alertContainer.querySelector('.alert-box');
            
            try {
                donationSound.src = SOUND_URL;
                donationSound.volume = currentSettings.tts_volume || 0.7;
                donationSound.play().catch(e => {
                    console.error("Не удалось воспроизвести звук оповещения. Убедитесь, что в OBS в свойствах источника 'Браузер' стоит галочка 'Управлять аудио через OBS'.", e);
                });
            } catch (e) {
                console.warn(`Не удалось загрузить звук ${SOUND_URL}.`);
            }

            setTimeout(() => alertBox.classList.add('visible'), 100);
            setTimeout(() => alertBox.classList.remove('visible'), ALERT_DURATION);
            setTimeout(() => {
                alertContainer.innerHTML = '';
                isShowingAlert = false;
                processQueue();
            }, ALERT_DURATION + 1000);
        }

        function playTTS(url, volume) {
            setTimeout(() => {
                const ttsAudio = new Audio(url);
                ttsAudio.volume = volume;
                ttsAudio.play().catch(e => console.error("Не удалось воспроизвести озвучку.", e));
            }, 1000);
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        connectWebSocket();
    </script>
</body>
</html>
