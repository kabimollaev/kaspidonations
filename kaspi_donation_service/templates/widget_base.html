<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Виджет{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Основные стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    <!-- Стили темы (если выбрана не темная по умолчанию) -->
    {% if user.settings.theme and user.settings.theme != 'dark' %}
    <link id="widget-theme-link" rel="stylesheet" href="{{ url_for('static', filename='css/theme_' + user.settings.theme + '.css') }}">
    {% endif %}

    {% block head_extra %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    <script>
        // Глобальная функция для безопасного вывода HTML, необходимая для всех виджетов
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        
        // Глобальная функция для динамической смены темы, вызываемая виджетами Top
        function updateTheme(theme) {
            // Проверяем, что theme - строка
            if (typeof theme !== 'string') return;
            
            const currentThemeLink = document.getElementById('widget-theme-link');
            const themeUrl = theme === 'dark' 
                ? null 
                : "{{ url_for('static', filename='css/theme_') }}" + theme + ".css";

            if (themeUrl && theme !== 'dark') {
                if (currentThemeLink) {
                    currentThemeLink.href = themeUrl;
                } else {
                    const link = document.createElement('link');
                    link.id = 'widget-theme-link';
                    link.rel = 'stylesheet';
                    link.href = themeUrl;
                    document.head.appendChild(link);
                }
            } else if (currentThemeLink) {
                // Если тема 'dark', удаляем ссылку на светлую тему
                currentThemeLink.remove();
            }
        }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
