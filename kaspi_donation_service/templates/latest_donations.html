<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Donations Widget</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div id="latest-donations-container" class="widget-container">
        <h2 class="widget-title">Последние донаты</h2>
        <div id="latest-donations-list"></div>
    </div>
    <script>
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
            ws.onopen = () => console.log('Latest donations widget connected');
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'full_update') {
                    updateLatestDonations(message.data.donations);
                } else if (message.type === 'show_alert') {
                    // Обновляем список при новом донате
                    setTimeout(() => {
                        fetch('/api/get_all_data')
                            .then(r => r.json())
                            .then(data => updateLatestDonations(data.donations))
                            .catch(e => console.error('Failed to fetch donations:', e));
                    }, 500);
                }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }
        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function updateLatestDonations(donations) {
            const list = document.getElementById('latest-donations-list');
            const latest = donations.slice(0, 5);
            if(latest.length === 0) {
                list.innerHTML = '<p style="font-size: 1.2rem; text-align: center;">Пока пусто...</p>';
                return;
            }
            list.innerHTML = latest.map((d, index) => `
                <div class="list-item" style="animation-delay: ${index * 100}ms">
                    <span class="list-item-name">${escapeHtml(d.name)}</span>
                    <span class="list-item-amount">${d.amount.toLocaleString('ru-RU')} ₸</span>
                </div>
            `).join('');
        }
        connectWebSocket();
    </script>
</body>
</html>
