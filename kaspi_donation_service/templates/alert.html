<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Widget</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --widget-font: 'Inter', sans-serif;
            --title-color: #FFFFFF;
            --highlight-color: #F14635;
            --message-color: #A0AEC0;
        }
        body {
            /* Важно: прозрачный фон для OBS/TikTok Live */
            background-color: transparent !important; 
            font-family: var(--widget-font);
            overflow: hidden;
            margin: 0;
            padding: 0;
            color: var(--title-color);
        }
        .alert-container {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .alert-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .alert-box.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .alert-gif {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--highlight-color);
            box-shadow: 0 0 20px var(--highlight-color);
            margin-bottom: 20px;
        }
        .alert-content {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 16px 24px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            min-width: 300px;
            color: var(--message-color);
        }
        .alert-main-text {
            font-weight: 700;
            font-size: 1.8rem;
            line-height: 1.2;
            margin: 0;
            color: var(--title-color);
        }
        .alert-main-text .highlight {
            color: var(--highlight-color);
            font-weight: 900;
        }
        .alert-message {
            font-weight: 500;
            font-size: 1.1rem;
            margin-top: 8px;
            line-height: 1.4;
            color: var(--message-color);
            word-break: break-word; 
        }
    </style>
</head>
<body>
    <!-- Предварительная загрузка медиа -->
    <img id="preload-gif" style="display: none;" src="{{ url_for('static', filename='media/alert.gif') }}" alt="Preload GIF">
    
    <div id="alert-container" class="alert-container"></div>
    <script>
        let ws;
        let alertQueue = [];
        let isShowingAlert = false;
        let currentSettings = {};

        const alertContainer = document.getElementById('alert-container');
        const ALERT_DURATION = 8000;
        const audioPlayer = new Audio('{{ url_for("static", filename="media/alert.mp3") }}'); 
        audioPlayer.load(); 

        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function connectWebSocket() {
            const userId = "{{ user.id }}";
            const apiKey = "{{ user.api_key }}";
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            // Используем явную аутентификацию по API-ключу
            const wsUrl = `${wsProtocol}//${window.location.host}/ws?user_id=${userId}&api_key=${apiKey}`;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }

            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log("WebSocket connected.");
                setTimeout(processQueue, 500); 
            };
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'show_alert') {
                    alertQueue.push(message.data);
                    if (!isShowingAlert) {
                        processQueue();
                    }
                } else if (message.type === 'full_update') {
                    currentSettings = message.data.settings || {};
                    const newSoundUrl = currentSettings.sound_url || '{{ url_for("static", filename="media/alert.mp3") }}';
                    if (audioPlayer.src.split('?')[0] !== newSoundUrl.split('?')[0]) {
                        audioPlayer.src = newSoundUrl;
                        audioPlayer.load();
                    }
                }
            };
            
            ws.onclose = () => {
                console.warn("WebSocket closed. Reconnecting in 3s...");
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error detected. Closing connection:', error);
                if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
                    ws.close();
                }
            };
        }

        function processQueue() {
            if (isShowingAlert || alertQueue.length === 0) return;
            
            isShowingAlert = true;
            const data = alertQueue.shift();
            
            showAlert(data);
        }

        function showAlert(data) {
            const amountFormatted = data.amount.toLocaleString('ru-RU');
            const messageText = data.message ? escapeHtml(data.message) : '';
            const alertUrl = currentSettings.alert_url || document.getElementById('preload-gif').src;

            // 1. Создаем и вставляем визуал
            alertContainer.innerHTML = `
                <div class="alert-box">
                    <img src="${alertUrl}" class="alert-gif" alt="Donation animation">
                    <div class="alert-content">
                        <p class="alert-main-text">
                            ${escapeHtml(data.name)} - <span class="highlight">${amountFormatted} ₸</span>
                        </p>
                        ${messageText ? `<p class="alert-message">${messageText}</p>` : ''}
                    </div>
                </div>`;
            const alertBox = alertContainer.querySelector('.alert-box');
            
            // 2. Инициализируем показ визуала немедленно
            setTimeout(() => alertBox.classList.add('visible'), 50);

            // 3. Запускаем аудио в полностью отдельном потоке (Promise.resolve)
            // Это гарантирует, что даже если аудио будет заблокировано, визуал сработает.
            Promise.resolve().then(() => {
                audioPlayer.currentTime = 0; 
                return audioPlayer.play();
            }).catch(e => {
                console.error("Audio playback failed (Autoplay blocked):", e);
            });
            
            // 4. Устанавливаем таймер для скрытия
            setTimeout(hideAlert, ALERT_DURATION);
        }
        
        function hideAlert() {
            const alertBox = alertContainer.querySelector('.alert-box');
            
            audioPlayer.pause();
            audioPlayer.currentTime = 0; 

            if (alertBox) {
                alertBox.classList.remove('visible');
                setTimeout(() => {
                     alertContainer.innerHTML = '';
                     isShowingAlert = false;
                     processQueue();
                }, 500);
            } else {
                isShowingAlert = false;
                processQueue();
            }
        }
        
        connectWebSocket();
    </script>
</body>
</html>
