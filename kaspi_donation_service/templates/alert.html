<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Widget</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: transparent !important;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            color: white;
        }
        .alert-container {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .alert-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .alert-box.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .alert-gif {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #00D1B2;
            box-shadow: 0 0 20px rgba(0, 209, 178, 0.5);
            margin-bottom: 20px;
        }
        .alert-content {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 16px 24px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            min-width: 300px;
            max-width: 90%;
        }
        .alert-main-text {
            font-weight: 700;
            font-size: 1.8rem;
            line-height: 1.2;
            margin: 0;
            word-break: break-word;
        }
        .alert-main-text .highlight {
            color: #00D1B2;
            font-weight: 900;
        }
        .alert-message {
            font-weight: 500;
            font-size: 1.1rem;
            margin-top: 8px;
            line-height: 1.4;
            color: #E0E0E0;
            word-break: break-word; 
        }
    </style>
</head>
<body>
    <div id="alert-container" class="alert-container"></div>
    <audio id="donation-sound"></audio>
    <script>
        let alertQueue = [];
        let isShowingAlert = false;
        let currentSettings = { min_amount: 0, tts_volume: 0.7 }; // Настройки по умолчанию
        const alertContainer = document.getElementById('alert-container');
        const donationSound = document.getElementById('donation-sound');
        // Убедитесь, что эти файлы существуют в static/media
        const GIF_URL = '/static/media/alert.gif'; 
        const SOUND_URL = '/static/media/alert.mp3';
        const ALERT_DURATION = 8000;

        function connectWebSocket() {
            const pathParts = window.location.pathname.split('/');
            const userId = pathParts[pathParts.length - 1];
            if (!userId) {
                console.error('User ID не найден в URL');
                return;
            }

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws?user_id=${userId}`);
            
            ws.onopen = () => {
                console.log('[' + new Date().toLocaleTimeString() + '] WebSocket соединение установлено.');
            };
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'full_update') {
                    currentSettings = message.data.settings || { min_amount: 0, tts_volume: 0.7 };
                } else if (message.type === 'show_alert') {
                    // Проверяем минимальную сумму перед добавлением в очередь
                    if (message.data.amount >= currentSettings.min_amount) {
                        alertQueue.push(message.data);
                        processQueue();
                    }
                } else if (message.type === 'tts') {
                    playTTS(message.url, currentSettings.tts_volume);
                }
            };
            
            ws.onclose = () => {
                console.log('[' + new Date().toLocaleTimeString() + '] WebSocket соединение закрыто. Попытка переподключения...');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket Error:', error);
                ws.close();
            };
        }

        function processQueue() {
            if (isShowingAlert || alertQueue.length === 0) return;
            isShowingAlert = true;
            showAlert(alertQueue.shift());
        }

        function showAlert(data) {
            const amountFormatted = data.amount.toLocaleString('ru-RU');
            const messageText = data.message ? escapeHtml(data.message) : '';
            alertContainer.innerHTML = `
                <div class="alert-box">
                    <img src="${GIF_URL}" class="alert-gif" alt="Donation animation">
                    <div class="alert-content">
                        <p class="alert-main-text">
                            ${escapeHtml(data.name)} - <span class="highlight">${amountFormatted} ₸</span>
                        </p>
                        ${messageText ? `<p class="alert-message">${messageText}</p>` : ''}
                    </div>
                </div>`;
            
            const alertBox = alertContainer.querySelector('.alert-box');
            
            try {
                donationSound.src = SOUND_URL;
                donationSound.volume = currentSettings.tts_volume;
                donationSound.play().catch(e => console.error("Не удалось воспроизвести звук оповещения.", e));
            } catch (e) {
                console.warn(`Не удалось загрузить звук ${SOUND_URL}.`);
            }
            
            setTimeout(() => alertBox.classList.add('visible'), 100);
            setTimeout(() => alertBox.classList.remove('visible'), ALERT_DURATION);
            
            setTimeout(() => {
                alertContainer.innerHTML = '';
                isShowingAlert = false;
                processQueue();
            }, ALERT_DURATION + 500);
        }

        function playTTS(url, volume) {
            setTimeout(() => {
                const ttsAudio = new Audio(url);
                ttsAudio.volume = volume;
                ttsAudio.play().catch(e => console.error("Не удалось воспроизвести озвучку.", e));
            }, 1000);
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        connectWebSocket();
    </script>
</body>
</html>
