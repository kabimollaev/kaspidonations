<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Widget</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Переменные для кастомизации */
            --widget-font: 'Inter', sans-serif;
            --title-color: #FFFFFF;
            --highlight-color: #F14635;
            --message-color: #A0AEC0;
        }
        body {
            background-color: transparent !important;
            font-family: var(--widget-font);
            overflow: hidden;
            margin: 0;
            padding: 0;
            color: var(--title-color);
        }
        .alert-container {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .alert-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .alert-box.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .alert-gif {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--highlight-color);
            box-shadow: 0 0 20px var(--highlight-color);
            margin-bottom: 20px;
        }
        .alert-content {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 16px 24px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            min-width: 300px;
            color: var(--message-color);
        }
        .alert-main-text {
            font-weight: 700;
            font-size: 1.8rem;
            line-height: 1.2;
            margin: 0;
            color: var(--title-color);
        }
        .alert-main-text .highlight {
            color: var(--highlight-color);
            font-weight: 900;
        }
        .alert-message {
            font-weight: 500;
            font-size: 1.1rem;
            margin-top: 8px;
            line-height: 1.4;
            color: var(--message-color);
            word-break: break-word; 
        }
    </style>
</head>
<body>
    <div id="alert-container" class="alert-container"></div>
    <script>
        let ws;
        let alertQueue = [];
        let isShowingAlert = false;
        let currentSettings = {};
        let lastShownAlertId = null;

        const alertContainer = document.getElementById('alert-container');
        const ALERT_DURATION = 8000;
        
        const imagePreloader = new Image();
        const audioPreloader = new Audio();

        function connectWebSocket() {
            const userId = "{{ user_id }}";
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws?user_id=${userId}`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => console.log("WebSocket connected. Ready for alerts.");
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'show_alert') {
                    alertQueue.push(message.data);
                    processQueue();
                } else if (message.type === 'full_update') {
                    currentSettings = message.data.settings || {};
                    applyCustomizations(currentSettings);
                    
                    if (currentSettings.alert_url) {
                        imagePreloader.src = `${currentSettings.alert_url}?v=${new Date().getTime()}`;
                    }
                    if (currentSettings.sound_url) {
                        audioPreloader.src = `${currentSettings.sound_url}?v=${new Date().getTime()}`;
                        audioPreloader.load();
                    }
                }
            };
            
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
            ws.onerror = (error) => ws.close();
        }

        function processQueue() {
            if (isShowingAlert || alertQueue.length === 0) return;
            isShowingAlert = true;
            const data = alertQueue.shift();
            
            if (data.id === lastShownAlertId && !String(data.id).startsWith('test_')) {
                isShowingAlert = false;
                processQueue();
                return;
            }
            lastShownAlertId = data.id;
            showAlert(data);
        }

        function showAlert(data) {
            const amountFormatted = data.amount.toLocaleString('ru-RU');
            const messageText = data.message ? escapeHtml(data.message) : '';
            const alertUrl = imagePreloader.src; 

            alertContainer.innerHTML = `
                <div class="alert-box">
                    <img src="${alertUrl}" class="alert-gif" onerror="this.src='/static/media/alert.gif'" alt="Donation animation">
                    <div class="alert-content">
                        <p class="alert-main-text">
                            ${escapeHtml(data.name)} - <span class="highlight">${amountFormatted} ₸</span>
                        </p>
                        ${messageText ? `<p class="alert-message">${messageText}</p>` : ''}
                    </div>
                </div>`;
            const alertBox = alertContainer.querySelector('.alert-box');
            
            // Воспроизводим предзагруженный звук
            audioPreloader.volume = currentSettings.tts_volume || 0.7;
            audioPreloader.currentTime = 0;
            const playPromise = audioPreloader.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error("Audio play was prevented:", error);
                    console.log("Please check OBS Audio Settings for the Browser Source.");
                });
            }

            // Показываем визуальное оповещение
            setTimeout(() => alertBox.classList.add('visible'), 50); // Уменьшаем задержку для более быстрого появления

            // Устанавливаем таймер на скрытие оповещения
            setTimeout(hideAlert, ALERT_DURATION);
        }
        
        function hideAlert() {
            const alertBox = alertContainer.querySelector('.alert-box');
            if (alertBox) {
                alertBox.classList.remove('visible');
                setTimeout(() => {
                    if (isShowingAlert) {
                         alertContainer.innerHTML = '';
                         isShowingAlert = false;
                         processQueue();
                    }
                }, 500); // Уменьшаем время ожидания после исчезновения
            } else {
                isShowingAlert = false;
                processQueue();
            }
        }

        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        
        function applyCustomizations(settings) {
            document.documentElement.style.setProperty('--widget-font', settings.font_family || 'Inter');
            document.documentElement.style.setProperty('--title-color', settings.title_color || '#FFFFFF');
            document.documentElement.style.setProperty('--highlight-color', settings.highlight_color || '#F14635');
            document.documentElement.style.setProperty('--message-color', settings.message_color || '#A0AEC0');
        }

        connectWebSocket();
    </script>
</body>
</html>
