<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Widget</title>
    <!-- Подключаем все необходимые шрифты заранее -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Montserrat:wght@400;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Сброс стилей для OBS */
        body {
            background-color: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Используем CSS-переменную для шрифта */
            font-family: var(--alert-font-family);
            color: var(--alert-title-color);
        }

        /* Общие переменные для кастомизации */
        :root {
            --alert-font-family: 'Inter', sans-serif;
            --alert-title-color: #FFFFFF;
            --alert-highlight-color: #F14635;
            --alert-message-color: #A0AEC0;
        }

        .alert-container {
            display: none; /* Скрыт по умолчанию */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            max-width: 80%;
            width: 500px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .alert-container.show {
            display: block;
        }
        .alert-container.hide {
            animation: fadeOut 0.5s ease-in-out forwards;
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
        }

        .alert-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .alert-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--alert-title-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        .alert-amount {
            font-size: 3rem;
            font-weight: 900;
            color: var(--alert-highlight-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        
        .alert-message {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--alert-message-color);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            word-wrap: break-word;
        }

    </style>
</head>
<body>
    <div id="alert-container" class="alert-container">
        <img id="alert-image" src="" alt="Alert GIF" class="alert-image">
        <h2 id="alert-title" class="alert-title"></h2>
        <div id="alert-amount" class="alert-amount"></div>
        <p id="alert-message" class="alert-message"></p>
        <audio id="alert-sound" src="" preload="auto"></audio>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userId = {{ user_id }};
            const alertContainer = document.getElementById('alert-container');
            const alertImage = document.getElementById('alert-image');
            const alertTitle = document.getElementById('alert-title');
            const alertAmount = document.getElementById('alert-amount');
            const alertMessage = document.getElementById('alert-message');
            const alertSound = document.getElementById('alert-sound');

            const ws = new WebSocket(`ws://{{ request.host }}/ws?user_id=${userId}`);

            let alertTimer = null;
            let currentSettings = null;
            
            function updateCustomStyles() {
                if (currentSettings) {
                    document.documentElement.style.setProperty('--alert-font-family', currentSettings.font_family);
                    document.documentElement.style.setProperty('--alert-title-color', currentSettings.title_color);
                    document.documentElement.style.setProperty('--alert-highlight-color', currentSettings.highlight_color);
                    document.documentElement.style.setProperty('--alert-message-color', currentSettings.message_color);
                }
            }

            function showAlert(data) {
                if (!currentSettings) {
                    console.error('Настройки еще не загружены. Ожидаем full_update.');
                    return;
                }

                updateCustomStyles();

                // Устанавливаем содержимое
                alertImage.src = currentSettings.alert_url;
                alertTitle.textContent = `${data.name} отправил:`;
                alertAmount.textContent = `${data.amount} ₸`;
                alertMessage.textContent = data.message || 'без сообщения';
                
                // Звук
                alertSound.src = currentSettings.sound_url;
                alertSound.volume = currentSettings.tts_volume;
                alertSound.play().catch(e => console.error("Ошибка воспроизведения звука:", e));

                // Показываем алерт
                alertContainer.classList.add('show');
                alertContainer.classList.remove('hide');
                alertContainer.style.display = 'block';
                
                // Скрываем через 10 секунд
                clearTimeout(alertTimer);
                alertTimer = setTimeout(() => {
                    alertContainer.classList.add('hide');
                    alertContainer.classList.remove('show');
                    setTimeout(() => {
                        alertContainer.style.display = 'none';
                    }, 500); // Совпадает с длительностью анимации
                }, 10000);
            }

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'show_alert') {
                    showAlert(message.data);
                } else if (message.type === 'tts') {
                    // TTS - это отдельный аудиофайл
                    const ttsAudio = new Audio(message.url);
                    if (currentSettings) {
                         ttsAudio.volume = currentSettings.tts_volume;
                    }
                    ttsAudio.play().catch(e => console.error("Ошибка воспроизведения TTS:", e));
                } else if (message.type === 'full_update') {
                    currentSettings = message.data.settings;
                    updateCustomStyles();
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket Error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket closed. Attempting to reconnect...');
                setTimeout(() => {
                    window.location.reload();
                }, 5000);
            };
        });
    </script>
</body>
</html>
