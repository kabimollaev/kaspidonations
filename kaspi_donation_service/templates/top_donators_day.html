{% extends "widget_base.html" %}
{% block title %}Топ дня{% endblock %}

{% block content %}
<div class="widget-container">
    <h2 class="widget-title">Топ дня</h2>
    <div id="donators-list">
        <p style="text-align: center; color: var(--text-muted);">Загрузка...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const listElement = document.getElementById('donators-list');
        const userId = "{{ user.id }}";
        const apiKey = "{{ user.api_key }}";

        function updateList(topDonators) {
            if (!topDonators || topDonators.length === 0) {
                listElement.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Донатов сегодня пока нет.</p>';
                return;
            }
            
            listElement.innerHTML = topDonators.map((d, index) => `
                <div class="donator-item" style="animation-delay: ${index * 100}ms">
                    <span class="donator-rank">#${index + 1}</span>
                    <span class="donator-name">${escapeHtml(d.name)}</span>
                    <span class="donator-amount">${d.amount.toLocaleString('ru-RU')} ₸</span>
                </div>
            `).join('');
        }

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws?user_id=${userId}&api_key=${apiKey}`;
        
        function connect() {
            const ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'full_update') {
                    if (typeof updateTheme === 'function') { updateTheme(message.data.settings.widget_theme); }
                    // ИСПРАВЛЕНО: Берем готовый список из 'top_donators.day'
                    updateList(message.data.top_donators.day);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 3000);
            };
        }

        connect();
    });
</script>
{% endblock %}
