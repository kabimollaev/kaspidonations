<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История донатов</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        body { padding: 0; }
        .widget-container { 
            border-radius: 0; 
            height: 100vh;
            border: none;
        }
        #latest-donations-list {
            overflow-y: auto;
            height: calc(100vh - 120px); /* 100% высоты минус шапка */
        }
    </style>
</head>
<body>
    <div id="latest-donations-container" class="widget-container">
        <h2 class="widget-title">История донатов</h2>
        <div id="latest-donations-list"></div>
    </div>
    <script>
        function connectWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'full_update') {
                    updateLatestDonations(message.data.donations);
                }
            };
             ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }
        function escapeHtml(unsafe) {
            if(typeof unsafe !== 'string') return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function updateLatestDonations(donations) {
            const list = document.getElementById('latest-donations-list');
            if(!donations || donations.length === 0) {
                list.innerHTML = '<p style="font-size: 1.2rem; text-align: center;">Пока пусто...</p>';
                return;
            }
            list.innerHTML = donations.map((d, index) => `
                <div class="list-item" style="animation-delay: ${index * 50}ms">
                    <span class="list-item-name">${escapeHtml(d.name)}</span>
                    <span class="list-item-amount">${d.amount.toLocaleString('ru-RU')} ₸</span>
                </div>
            `).join('');
        }
        connectWebSocket();
    </script>
</body>
</html>
