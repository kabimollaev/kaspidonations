{% extends "widget_base.html" %}
{% block title %}Топ месяца{% endblock %}
{% block widget_title %}Топ месяца{% endblock %}

{% block content %}
<div id="donators-list">
    <p style="text-align: center; color: var(--text-muted);">Загрузка...</p>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const listElement = document.getElementById('donators-list');
        const userId = "{{ user_id }}";
        const apiKey = "{{ api_key }}";

        function updateList(donations) {
            // ФИЛЬТРАЦИЯ НА СТОРОНЕ КЛИЕНТА
            const today = new Date();
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

            const monthlyDonations = donations.filter(d => {
                const donationDate = new Date(d.timestamp);
                return donationDate >= firstDayOfMonth;
            });

            const topDonators = monthlyDonations.reduce((acc, d) => {
                acc[d.name] = (acc[d.name] || 0) + d.amount;
                return acc;
            }, {});

            const sorted = Object.entries(topDonators)
                .sort(([, a], [, b]) => b - a)
                .slice(0, 10);

            if (sorted.length === 0) {
                listElement.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Донатов в этом месяце пока нет.</p>';
                return;
            }
            
            listElement.innerHTML = sorted.map(([name, amount], index) => `
                <div class="donator-item" style="animation-delay: ${index * 100}ms">
                    <span class="donator-rank">#${index + 1}</span>
                    <span class="donator-name">${escapeHtml(name)}</span>
                    <span class="donator-amount">${amount.toLocaleString('ru-RU')} ₸</span>
                </div>
            `).join('');
        }

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws?user_id=${userId}&api_key=${apiKey}`;
        
        function connect() {
            const ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'full_update') {
                    updateTheme(message.data.settings.widget_theme);
                    updateList(message.data.donations);
                }
            };

            ws.onclose = () => {
                setTimeout(connect, 3000);
            };
        }
        
        connect();
    });
</script>
{% endblock %}
